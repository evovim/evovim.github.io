<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="plate-title plate-desc">
  <title id="plate-title">EvoViM — Task execution and Memory evolution</title>
  <desc id="plate-desc">A frozen model records observations, consults a memory program, and acts. During memory evolution the model uses development episodes and enhanced feedback to revise the program. It also rewrites the playbook, notes and scripts that later revisions read. Code checks and a gate determine which program becomes the next parent.</desc>
  <defs>
    <style>text { font-family:'Helvetica Neue',Arial,sans-serif; fill:#273941; }
  .section {font:22px Georgia,'Times New Roman',serif;letter-spacing:-.6px}
  .title {font:19px Georgia,'Times New Roman',serif;letter-spacing:-.45px}
  .sub {font-size:16px;font-weight:650;letter-spacing:-.25px}
  .desc {font-size:13px;fill:#4a5c65}
  .small {font-size:12px;font-weight:500}
  .edge-label {font-size:12px;font-weight:500}
  .blue {fill:#184878} .teal {fill:#245f5d} .clay {fill:#9d5144} .plum {fill:#675087}
  .wire {fill:none;stroke-width:1.6px;stroke-linecap:round;stroke-linejoin:round}
  .box {stroke-width:1.25px}
  .bluebox {fill:#f4f8fc;stroke:#91acc4}
  .tealbox {fill:#f4f9f7;stroke:#81a8a0}
  .claybox {fill:#fcf7f3;stroke:#c3a093}
  .plumbox {fill:#f7f4fa;stroke:#ab99c0}
  .glyph {fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}</style>
    <marker id="arr-blue" markerUnits="userSpaceOnUse" orient="auto" refX="7.3" refY="4" markerWidth="8" markerHeight="8"><path d="M0 .3 7.3 4 0 7.7 2 4Z" fill="#437795"/></marker>
    <marker id="arr-clay" markerUnits="userSpaceOnUse" orient="auto" refX="7.3" refY="4" markerWidth="8" markerHeight="8"><path d="M0 .3 7.3 4 0 7.7 2 4Z" fill="#ab7060"/></marker>
    <marker id="arr-plum" markerUnits="userSpaceOnUse" orient="auto" refX="7.3" refY="4" markerWidth="8" markerHeight="8"><path d="M0 .3 7.3 4 0 7.7 2 4Z" fill="#8268a3"/></marker>
    <marker id="arr-teal" markerUnits="userSpaceOnUse" orient="auto" refX="7.3" refY="4" markerWidth="8" markerHeight="8"><path d="M0 .3 7.3 4 0 7.7 2 4Z" fill="#4b7f79"/></marker>
    <g id="icon-book" class="glyph"><path d="M1.5 5.5Q7 3.5 12 7Q17 3.5 22.5 5.5V21Q16.6 19.2 12 22Q7.5 19.2 1.5 21ZM12 7V21M4.5 9Q7.5 8.4 9.3 10M15 10Q17 8.4 20 9"/></g>
    <g id="icon-note" class="glyph"><path d="M4 2.5H15.5L21 8V22H4ZM15 3.5V8.5H20M7.5 12.5H16.7M7.5 16.5H14.5"/></g>
    <g id="icon-script" class="glyph"><path d="M2 3.5H22V20.5H2ZM2 7.5H22M8.2 10.8 5.9 13.6 8.2 16.4M16.1 10.8 18.4 13.6 16.1 16.4M13.5 10.6 11.6 16.8"/></g>
    <g id="icon-frames" class="glyph"><path d="M2 6H15.5V16H2ZM5.5 2.7H19V13M9 0H22.2V10M5 13l2.2-3 2.5 2 2.5-3.5"/></g>
    <g id="icon-pixels" class="glyph"><path d="M2.5 3.5h6v6h-6ZM2.5 14.5h6v6h-6ZM13.5 3.5h6v6h-6ZM11.5 14.5h2l2-3 2.6 7 1.4-3h2.5"/></g>
    <g id="icon-recall" class="glyph"><path d="M2 5H15.5V17H2ZM4.6 13.6l2.3-3.3 2.6 2.3 2.4-3.6M11.5 20.5h9V10.7m-5.4 5 5.4-5.2 3 4.6"/></g>
    <g id="icon-prompt" class="glyph"><path d="M2.5 4.5h19v13h-9l-5.5 4v-4h-4.5ZM6.5 8.6h11M6.5 12.5h7.5"/></g>
    <g id="icon-memops" class="glyph"><path d="M2 7 12 2l10 5-10 5ZM2 12l10 5 10-5M2 17l10 5 10-5"/></g>
    <g id="icon-tool" class="glyph"><path d="m6 6.5-4.5 5 4.5 5m12-10 4.5 5-4.5 5M14.5 4l-5 16"/></g>
    <g id="icon-revision" class="glyph"><path d="M4.2 17.5V8.8q0-3 3-3h9.6q3 0 3 3v8.7q0 2.3-2.8 2.3H7q-2.8 0-2.8-2.3ZM12 5.8V2.5m-2 10.5h.1m3.8 0h.1m-4.1 3q2.1 1.5 4.2 0M1.5 10v5m21-5v5"/></g>
    <g id="icon-env" class="glyph"><path d="m2.5 7.5 9.5-5.2 9.5 5.2v10L12 23l-9.5-5.5Zm0 0 9.5 5.4 9.5-5.4M12 13v9.5"/></g>
  </defs>
  <g id="connections">
    <g class="wire" stroke="#437795" marker-end="url(#arr-blue)">
      <path id="path-observation" d="M348 247 V76 Q348 55 369 55 H410"/>
      <path id="path-action" d="M410 509 H369 Q348 509 348 487 V318"/>
      <path id="path-write" d="M469 55 H660 Q673 55 673 68 V77"/>
      <path id="path-read" d="M673 488 V497 Q673 509 660 509 H469"/>
    </g>
    <g class="wire" stroke="#ab7060" marker-end="url(#arr-clay)">
      <path id="path-episode" d="M325 318 V348 Q325 363 311 363 H292"/>
      <path id="path-summarized" d="M196 326 V298"/>
      <path id="path-episodesToRevision" d="M101 362 H91"/>
      <path id="path-feedbackToRevision" d="M101 244 H91"/>
      <path id="path-checks" d="M37 211 V27 Q37 10 54 10 H1038 Q1053 10 1053 26 V36"/>
      <path id="path-checked" d="M1053 63 V197"/>
      <path id="path-score" d="M1053 424 V537"/>
      <path id="path-accept" d="M1023 550 H958"/>
      <path id="path-parent" d="M662 550 H85 Q72 550 72 538 V394"/>
      <path id="path-retry" d="M1053 565 V568 Q1053 581 1040 581 H51 Q32 581 32 564 V394" stroke-dasharray="5 5"/>
    </g>
    <g class="wire" stroke="#8268a3" marker-end="url(#arr-plum)">
      <path id="path-experienceToRevision" d="M102 120 H78 Q67 120 67 132 V211"/>
      <path id="path-rewrite" d="M37 211 V27 Q37 10 54 10 H250 V84"/>
    </g>
    <path id="path-install" class="wire" stroke="#4b7f79" marker-end="url(#arr-teal)" d="M915 282 H865"/>
  </g>
  <g id="part-evolution">
    <text x="53" y="38" class="section clay">Memory evolution</text>
  </g>
  <g id="part-execution">
    <text x="296" y="38" class="section blue">Task execution</text>
  </g>
  <g class="edge-label">
    <text x="203" y="67" class="edge-label plum">rewrite</text>
    <text x="562" y="47" class="edge-label blue">write</text>
    <text x="356" y="179" class="edge-label blue">observation</text>
    <text x="356" y="465" class="edge-label blue">action</text>
    <text x="565" y="526" class="edge-label blue">read</text>
    <text x="202" y="317" class="edge-label clay">summarized</text>
    <text x="871" y="272" class="edge-label teal">install</text>
    <text x="1062" y="476" class="edge-label clay">dev score</text>
    <text x="966" y="541" class="edge-label clay">accept</text>
    <text x="243" y="541" class="edge-label clay">parent</text>
    <text x="462" y="599" class="edge-label clay">reject: retry once</text>
  </g>
  <g id="part-experience">
    <rect x="102" y="84" width="190" height="81" rx="9" class="box plumbox" />
    <text x="197" y="106" class="title plum" text-anchor="middle" style="font-size:17px">Revision experience</text>
    <g transform="translate(124 115) scale(0.916667)"><use xlink:href="#icon-book" color="#775a9c"/></g>
    <g transform="translate(186 115) scale(0.916667)"><use xlink:href="#icon-note" color="#775a9c"/></g>
    <g transform="translate(244 115) scale(0.916667)"><use xlink:href="#icon-script" color="#775a9c"/></g>
    <text x="135" y="153" class="small" text-anchor="middle">playbook</text>
    <text x="197" y="153" class="small" text-anchor="middle">notes</text>
    <text x="255" y="153" class="small" text-anchor="middle">scripts</text>
  </g>
  <g id="part-feedback">
    <rect x="101" y="184" width="191" height="114" rx="9" class="box claybox" />
    <text x="113" y="207" class="title clay" style="font-size:17.5px">Enhanced feedback</text>
    <circle cx="117" cy="227" r="2.4" fill="#b77a68"/><text x="127" y="231" class="desc">episode digests</text>
    <circle cx="117" cy="245" r="2.4" fill="#b77a68"/><text x="127" y="249" class="desc">tool use</text>
    <circle cx="117" cy="263" r="2.4" fill="#b77a68"/><text x="127" y="267" class="desc">analysis questions</text>
    <circle cx="117" cy="281" r="2.4" fill="#b77a68"/><text x="127" y="285" class="desc">predicted vs. measured</text>
  </g>
  <g id="part-development">
    <rect x="101" y="326" width="191" height="73" rx="9" class="box claybox" />
    <text x="113" y="350" class="title clay" style="font-size:16.8px">Development episodes</text>
    <text x="113" y="372" class="desc">Frames, actions and</text>
    <text x="113" y="389" class="desc">memory snapshots</text>
  </g>
  <g id="part-revision">
    <rect x="11" y="211" width="80" height="183" rx="12" class="box claybox" />
    <g transform="translate(36 251) scale(1.29167)"><rect x="-5" y="-5" width="34" height="34" rx="9" fill="#f4e8e1"/><use xlink:href="#icon-revision" color="#a45a4b"/></g>
    <text x="51" y="308" class="title clay" text-anchor="middle" style="font-size:16.8px">Revision</text>
    <text x="51" y="331" class="desc" text-anchor="middle">Frozen</text>
    <text x="51" y="348" class="desc" text-anchor="middle">MLLM</text>
  </g>
  <g id="part-environment">
    <rect x="299" y="247" width="100" height="71" rx="9" class="box bluebox" />
    <g transform="translate(339 258) scale(0.833333)"><use xlink:href="#icon-env" color="#38658b"/></g>
    <text x="349" y="302" class="sub blue" text-anchor="middle" style="font-size:13.7px">Environment</text>
  </g>
  <g id="part-record">
    <rect x="410" y="42" width="59" height="26" rx="7" class="box bluebox" />
    <text x="439.5" y="60" class="sub blue" text-anchor="middle" style="font-size:13px">Record</text>
  </g>
  <g id="part-act">
    <rect x="410" y="496" width="59" height="26" rx="7" class="box bluebox" />
    <text x="439.5" y="514" class="sub blue" text-anchor="middle" style="font-size:13px">Act</text>
  </g>
  <g id="part-memory">
    <rect x="480" y="77" width="385" height="411" rx="14" class="box tealbox" />
    <text x="501" y="102" class="title teal" style="font-size:22.5px">Memory program</text>
  </g>
  <g id="part-pixels">
    <g transform="translate(515 143) scale(1.20833)"><rect x="-5" y="-5" width="34" height="34" rx="9" fill="#dfede8"/><use xlink:href="#icon-pixels" color="#39786e"/></g>
    <text x="568" y="151" class="sub teal" style="font-size:17.5px">Pixel computation</text>
    <text x="568" y="176" class="desc" style="font-size:13.1px">Process the current and stored images.</text>
  </g>
  <g id="part-frames">
    <g transform="translate(515 236) scale(1.20833)"><rect x="-5" y="-5" width="34" height="34" rx="9" fill="#dfede8"/><use xlink:href="#icon-frames" color="#39786e"/></g>
    <text x="568" y="244" class="sub teal" style="font-size:17.5px">Frame memory</text>
    <text x="568" y="269" class="desc" style="font-size:13.1px">Store selected frames, crops or features.</text>
  </g>
  <g id="part-recall">
    <g transform="translate(515 332) scale(1.20833)"><rect x="-5" y="-5" width="34" height="34" rx="9" fill="#dfede8"/><use xlink:href="#icon-recall" color="#39786e"/></g>
    <text x="568" y="340" class="sub teal" style="font-size:17.5px">Visual recall</text>
    <text x="568" y="365" class="desc" style="font-size:13.1px">Bring saved images into the next request.</text>
  </g>
  <g id="part-prompt">
    <g transform="translate(515 426) scale(1.20833)"><rect x="-5" y="-5" width="34" height="34" rx="9" fill="#dfede8"/><use xlink:href="#icon-prompt" color="#39786e"/></g>
    <text x="568" y="434" class="sub teal" style="font-size:17.5px">Prompt at question steps</text>
    <text x="568" y="459" class="desc" style="font-size:13.1px">Specify how to use recalled evidence.</text>
  </g>
  <g id="part-checks">
    <rect x="1003" y="36" width="100" height="27" rx="7" class="box claybox" />
    <text x="1053" y="54" class="sub clay" text-anchor="middle" style="font-size:13.4px">Code checks</text>
  </g>
  <g id="part-candidate">
    <rect x="915" y="197" width="273" height="227" rx="12" class="box tealbox" />
    <text x="933" y="224" class="title teal" style="font-size:21.5px">Candidate program</text>
    <g transform="translate(941 254) scale(0.791667)"><rect x="-5" y="-5" width="34" height="34" rx="9" fill="#dfede8"/><use xlink:href="#icon-prompt" color="#39786e"/></g>
    <text x="978" y="260" class="sub teal" style="font-size:15.8px">Prompts</text>
    <text x="978" y="281" class="desc" style="font-size:12.6px">Guide model requests.</text>
    <g transform="translate(941 317) scale(0.791667)"><rect x="-5" y="-5" width="34" height="34" rx="9" fill="#dfede8"/><use xlink:href="#icon-memops" color="#39786e"/></g>
    <text x="978" y="323" class="sub teal" style="font-size:15.8px">Memory operations</text>
    <text x="978" y="344" class="desc" style="font-size:12.6px">Update and consult episode state.</text>
    <g transform="translate(941 380) scale(0.791667)"><rect x="-5" y="-5" width="34" height="34" rx="9" fill="#dfede8"/><use xlink:href="#icon-tool" color="#39786e"/></g>
    <text x="978" y="386" class="sub teal" style="font-size:15.8px">Tools</text>
    <text x="978" y="407" class="desc" style="font-size:12.6px">Run task-specific computations.</text>
  </g>
  <g id="part-lineage">
    <rect x="662" y="533" width="296" height="34" rx="8" class="box claybox" />
    <text x="678" y="555" class="title clay" style="font-size:16.5px">Program lineage</text>
    <text x="944" y="554" class="desc" text-anchor="end" style="font-size:12.2px">selected programs</text>
  </g>
  <g id="part-gate">
    <rect x="1023" y="537" width="61" height="28" rx="7" class="box claybox" />
    <text x="1053.5" y="555.5" class="sub clay" text-anchor="middle" style="font-size:13.6px">Gate</text>
  </g>
</svg>
